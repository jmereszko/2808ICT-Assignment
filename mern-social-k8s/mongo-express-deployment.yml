apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-express-deployment
  labels:
    app: mongo-express
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-express
  template:
    metadata:
      labels:
        app: mongo-express
    spec:
      containers:
        - name: mongo-express
          image: mongo-express
          env:
            - name: ME_CONFIG_MONGODB_SERVER
              value: "mern-social-db"
            - name: ME_CONFIG_MONGODB_URL
              value: "mongodb://mern-social-db:27017"
            - name: ME_CONFIG_SITE_BASEURL
              value: "/mongo-express/"
          ports:
            - containerPort: 8081
