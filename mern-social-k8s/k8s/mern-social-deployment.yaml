apiVersion: apps/v1                # API version for Deployments
kind: Deployment                   # We're creating a Deployment object
metadata:
  name: mern-social                # Name of the Deployment (must be unique in the namespace)
  namespace: mern                  # Namespace to put it in (make sure 'mern' exists)
spec:
  replicas: 1                      # Run exactly 1 copy of this Pod (for testing)
  selector:
    matchLabels:
      app: mern-social             # Deployment will manage Pods with this label
  template:                        # Template defines how the Pods should look
    metadata:
      labels:
        app: mern-social           # Pod label (must match selector above!)
    spec:
      containers:
        - name: mern-social        # Container name (arbitrary, but should be meaningful)
          image: mern-social:local # Image to run (built earlier into Minikube)
          imagePullPolicy: Never   # Tell K8s NOT to pull from Docker Hub — use local image
          ports:
            - containerPort: 3000  # The port the app listens on inside the container
          env:                     # Environment variables for the app
            - name: MONGO_URI
              value: mongodb://mern-mongo.mern.svc.cluster.local:27017/mernsocial
              # Connection string to MongoDB Service running in the same namespace

