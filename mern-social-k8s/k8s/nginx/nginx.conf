worker_processes 1;                           # Run with a single worker process (enough for small deployments)

events { 
    worker_connections 1024;                  # Each worker can handle up to 1024 simultaneous connections
}

http {
    sendfile on;                              # Use efficient file transfers (zero-copy)
    large_client_header_buffers 4 32k;        # Allocate buffers for large HTTP headers

    # ------------ HTTP SERVER (port 80) -------------
    server {
        listen 80;                            # Listen on port 80 (insecure HTTP)
        server_name localhost;                # Server name (matches localhost)

        location / {
            return 301 https://$host$request_uri;  
            # Redirect all HTTP traffic to HTTPS (enforce TLS security)
        }
    }

    # --------- HTTPS server (port 443) --------------
    server {
        listen 443 ssl;                       # Listen on port 443 with SSL enabled
        server_name localhost;                # Server name (localhost)

        ssl_certificate /etc/nginx/certs/localhost.crt;    # Path to TLS certificate
        ssl_certificate_key /etc/nginx/private/localhost.key; # Path to TLS private key

        # Default route -> forward to MERN Social webapp
        location / {
            proxy_pass http://mern-social:3000/;   # Forward requests to the "mern-social-service" on port 3000
            proxy_redirect off;                       # Disable automatic redirects
            proxy_http_version 1.1;                   # Use HTTP/1.1
            proxy_cache_bypass $http_upgrade;         # Prevent caching when upgrading to websockets

            # Pass important headers to the backend
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection keep-alive;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;              # Preserve client IP
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;

            # Configure buffer sizes for proxying responses
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # Route specifically for Mongo Express UI
        location /mongo-express/ {
            proxy_pass http://mongo-express-service:8081/mongo-express/; 
            # Forward requests to the mongo-express-service on port 8081

            proxy_redirect off;
            proxy_http_version 1.1;
            proxy_cache_bypass $http_upgrade;

            # Same set of headers as above
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection keep-alive;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;

            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }
    }
}

