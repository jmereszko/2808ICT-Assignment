apiVersion: kustomize.config.k8s.io/v1beta1

kind: Kustomization

namespace: assignment

configMapGenerator:
  - name: nginx-config
    files:
      - nginx/nginx.conf

secretGenerator:
  - name: nginx-certs
    files:
      - nginx/certs/localhost.crt
      - nginx/certs/localhost.key

resources:
  - namespace.yaml
  - mern-social-deployment.yaml
  - mern-social-service.yaml
  - mongo-pvc.yaml
  - mongo-db-deployment.yaml
  - mongo-db-service.yaml
  - mongo-express-deployment.yaml
  - mongo-express-service.yaml
  - nginx-deployment.yaml
  - nginx-service.yaml

