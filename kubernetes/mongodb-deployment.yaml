# Kubernetes API version being used - apps/v1 includes Deployments
apiVersion: apps/v1
# The type of resource - Deployment manages a set of identical pods
kind: Deployment
# Metadata contains information about this resource
metadata:
  name: mongodb  # Name of the deployment - used to reference it later
spec:
  # Selector tells Kubernetes which pods belong to this deployment
  selector:
    matchLabels:
      app: mongodb  # Pods with this label are part of this deployment
  # Template defines how new pods should be created
  template:
    metadata:
      # Labels attached to the pods created by this template
      labels:
        app: mongodb  # This must match the selector above
    spec:
      # List of containers to run in each pod
      containers:
      - name: mongodb  # Container name
        image: mongo:4.2.0  # Docker image to use (MongoDB version 4.2.0)
        ports:
        - containerPort: 27017  # MongoDB's default port
        # Environment variables for the container
        env:
        - name: MONGO_INITDB_ROOT_USERNAME  # MongoDB admin username
          valueFrom:
            secretKeyRef:  # Get value from a Kubernetes Secret
              name: mongo-secret  # Name of the secret
              key: mongo-username  # Key in the secret
        - name: MONGO_INITDB_ROOT_PASSWORD  # MongoDB admin password
          valueFrom:
            secretKeyRef:
              name: mongo-secret
              key: mongo-password
        # Mount points for volumes inside the container
        volumeMounts:
        - name: mongodb-data  # Name of the volume mount
          mountPath: /data/db  # Where MongoDB stores its data
      # Volumes available to the containers in this pod
      volumes:
      - name: mongodb-data  # Must match the volumeMount name
        persistentVolumeClaim:
          claimName: mongodb-pvc  # Reference to PVC defined below

---
# The three dashes separate different resources in the same YAML file

# API version for Service resources
apiVersion: v1
# Type of resource - Service provides networking for pods
kind: Service
metadata:
  name: mongodb  # Name of the service - other pods use this to connect
spec:
  # Which pods should this service route traffic to
  selector:
    app: mongodb  # Matches the label on our MongoDB pods
  ports:
  - port: 27017  # Port the service listens on
    targetPort: 27017  # Port on the pod to forward traffic to
  # ClusterIP means this service is only accessible inside the cluster
  type: ClusterIP

---
# API version for PersistentVolumeClaim resources
apiVersion: v1
# Type of resource - PVC requests storage that pods can use
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc  # Name referenced by the volume in the Deployment
spec:
  accessModes:
    - ReadWriteOnce  # Can be mounted for read/write by a single node
  # How much storage to request from the cluster
  resources:
    requests:
      storage: 1Gi  # 1 Gigabyte of storage# Kubernetes API version being used - apps/v1 includes Deployments
